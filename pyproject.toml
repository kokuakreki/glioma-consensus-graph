[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "glioma-consensus-graph"
version = "1.0.0"
description = "Typed relational multi-omics graph learning for glioma"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.5.1",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
  "pyyaml==6.0.2",
  "lifelines==0.30.0",
]

[project.scripts]
glioma-train = "glioma_consensus.cli:train_main"
glioma-evaluate = "glioma_consensus.cli:evaluate_main"
glioma-prepare = "glioma_consensus.cli:prepare_main"

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

